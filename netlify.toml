[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# model và giọng đọc ít đổi: cho trình duyệt nhớ 1 tuần (đổi file thì đổi tên hoặc chờ hết hạn)
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# file JS/CSS của Vite có hash trong tên, nhớ vĩnh viễn
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
